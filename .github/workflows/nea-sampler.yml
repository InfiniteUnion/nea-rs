name: NEA API Sampler

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: nea-api-sampler
  cancel-in-progress: true

jobs:
  sample:
    name: Sample upstream API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Restore compiled sampler binary
        id: sampler-binary-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/release/examples/upstream_sampler
          key: nea-sampler-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**/*.rs', 'examples/upstream_sampler.rs') }}
      - name: Install Rust toolchain
        if: ${{ steps.sampler-binary-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Restore Cargo dependency cache
        if: ${{ steps.sampler-binary-cache.outputs.cache-hit != 'true' }}
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: nea-sampler
      - name: Build upstream sampler
        if: ${{ steps.sampler-binary-cache.outputs.cache-hit != 'true' }}
        run: cargo build --release --example upstream_sampler
      - name: Save compiled sampler binary
        if: ${{ steps.sampler-binary-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/release/examples/upstream_sampler
          key: ${{ steps.sampler-binary-cache.outputs.cache-primary-key }}
      - name: Ensure sampler is executable
        run: chmod +x target/release/examples/upstream_sampler
      - name: Run upstream sampler
        id: sample
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
        run: target/release/examples/upstream_sampler
      - name: Stage captured regression samples
        id: stage-samples
        if: ${{ steps.sample.outcome == 'failure' && hashFiles('target/nea-upstream-samples/*.json') != '' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          sample_number="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          for captured in target/nea-upstream-samples/*.json; do
            endpoint="$(basename "$captured" .json)"
            cp "$captured" "tests/samples/${endpoint}-${sample_number}.json"
          done
      - name: Open draft regression-sample pull request
        id: sample-pr
        if: ${{ steps.stage-samples.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_NAME: automation/nea-samples-${{ github.run_id }}-${{ github.run_attempt }}
          PR_TITLE: "test: capture NEA upstream decode failure"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH_NAME"
          git add tests/samples
          git commit --message "$PR_TITLE"
          git push --set-upstream origin "$BRANCH_NAME"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body-file target/nea-upstream-sampler-issue.md \
            --draft
      - name: Open or update decode-failure issue
        if: >-
          ${{
            always()
            && steps.sample.outcome == 'failure'
            && hashFiles('target/nea-upstream-sampler-issue.md') != ''
            && (
              hashFiles('target/nea-upstream-samples/*.json') == ''
              || steps.stage-samples.outcome == 'failure'
              || steps.sample-pr.outcome == 'failure'
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: NEA upstream API sample decode failure
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file target/nea-upstream-sampler-issue.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file target/nea-upstream-sampler-issue.md
          fi
      - name: Fail workflow on sampler failure
        if: ${{ always() && steps.sample.outcome == 'failure' }}
        run: exit 1
